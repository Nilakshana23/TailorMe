<script>
        document.addEventListener('DOMContentLoaded', () => {
            const preview = document.getElementById('dress-preview');
            
            // Simple mouse parallax for the preview area
            document.querySelector('section').addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const { innerWidth, innerHeight } = window;
                const moveX = (clientX - innerWidth / 2) / 50;
                const moveY = (clientY - innerHeight / 2) / 50;
                
                preview.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            // Smooth scroll for options
            const optionsArea = document.querySelector('.overflow-y-auto');
            optionsArea.addEventListener('scroll', () => {
                const scrollPos = optionsArea.scrollTop;
                // Add any scroll-based effects here if needed
            });
        });
